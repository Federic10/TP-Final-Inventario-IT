name: Pruebas del inventario
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: API - ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Probar CRUD y base de datos
        run: python -m unittest discover -s tests -v
  interfaz:
    name: Interfaz - Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramienta de prueba
        run: npm install --no-save playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Probar interfaz completa
        run: node tests/test_ui.cjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: test-results/
          if-no-files-found: ignore
